<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact — esoterica</title>
  </head>
  <body class="page-contact">
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="topbar topbar--solid">
      <div class="topbar__brand">
        <a class="wordmark topbar__wordmark" href="./" aria-label="esoterica, home">esoterica</a>
        <nav class="topbar__nav" aria-label="Main">
          <ul>
            <li><a href="./#shop">Shop</a></li>
            <li><a href="./#about">About</a></li>
          </ul>
        </nav>
      </div>
      <button type="button" class="topbar__cart" data-cart-toggle aria-haspopup="dialog" aria-controls="cart-drawer">Cart (<span data-cart-count>0</span>)</button>
    </header>

    <main id="content" class="contact" tabindex="-1">
      <h1 class="section-label">Contact</h1>
      <p class="contact__intro">For questions about an order, sizing or anything else, send us a message.</p>

      <form class="contact-form" data-contact-form novalidate>
        <div class="field">
          <label class="field-label" for="contact-name">Name</label>
          <input class="input" id="contact-name" name="name" type="text" autocomplete="name" required aria-describedby="contact-name-error">
          <p class="field-error" id="contact-name-error" data-error="name"></p>
        </div>

        <div class="field">
          <label class="field-label" for="contact-email">Email</label>
          <input class="input" id="contact-email" name="email" type="email" autocomplete="email" required aria-describedby="contact-email-error">
          <p class="field-error" id="contact-email-error" data-error="email"></p>
        </div>

        <div class="field">
          <label class="field-label" for="contact-subject">Subject <span class="muted">(optional)</span></label>
          <input class="input" id="contact-subject" name="subject" type="text">
        </div>

        <div class="field">
          <label class="field-label" for="contact-message">Message</label>
          <textarea class="input input--textarea" id="contact-message" name="message" rows="7" required aria-describedby="contact-message-error"></textarea>
          <p class="field-error" id="contact-message-error" data-error="message"></p>
        </div>

        <button type="submit" class="button">Send email</button>
        <p class="muted" id="contact-note">This opens your email app with your message ready to send.</p>
      </form>

      <p class="contact__direct">Or email us directly at <a data-contact-email href="#"></a></p>
    </main>

    <footer class="site-footer" data-site-footer></footer>

    <script type="module" src="/src/contact.ts"></script>
  </body>
</html>
